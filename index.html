<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Converta temperaturas entre Celsius, Fahrenheit e Kelvin." />
    <title>Conversor de Temperatura</title>
  </head>
  <body>
    <main class="page-shell">
      <section class="converter-card" aria-labelledby="page-title">
        <header class="card-header">
          <div>
            <h1 id="page-title">Conversor de Temperatura</h1>
            <p class="subtitle">Converta valores entre Celsius, Fahrenheit e Kelvin.</p>
          </div>
        </header>

        <form id="converter-form" class="converter-form">
          <div class="field-group">
            <label for="temperature">Valor da temperatura</label>
            <div class="input-wrap">
              <input id="temperature" name="temperature" type="number" step="any" placeholder="Ex.: 25" inputmode="decimal" required autofocus />
              <span id="input-unit" class="input-unit" aria-hidden="true">°C</span>
            </div>
          </div>

          <div class="field-group">
            <label for="conversion">Tipo de conversão</label>
            <div class="select-wrap">
              <select id="conversion" name="conversion">
                <option value="celsius-fahrenheit">Celsius → Fahrenheit</option>
                <option value="fahrenheit-celsius">Fahrenheit → Celsius</option>
                <option value="celsius-kelvin">Celsius → Kelvin</option>
                <option value="kelvin-celsius">Kelvin → Celsius</option>
              </select>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4" /></svg>
            </div>
          </div>

          <button type="submit">
            <span>Converter</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </button>
        </form>

        <div id="result-panel" class="result-panel" aria-live="polite">
          <div>
            <p class="result-label">Resultado</p>
            <p id="result" class="result-value">—</p>
          </div>
          <p id="result-detail" class="result-detail">Digite um valor para começar.</p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
